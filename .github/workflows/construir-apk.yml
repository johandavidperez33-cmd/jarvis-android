name: Construir APK de Jarvis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar el APK para descargarlo desde el celular
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk jarvis.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk jarvis.apk \
            --title "Jarvis para Android" \
            --notes "Descarga jarvis.apk en el celular e instálalo. Versión del commit ${GITHUB_SHA::7}."
